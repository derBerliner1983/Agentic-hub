# V.A.U.L.T. Agentic OS – App-Stack
# orchestrator = FastAPI + HUD · caddy = HTTPS-Reverse-Proxy (für Browser-Mikro/Voice)
services:
  orchestrator:
    build: ./services/orchestrator
    container_name: vault-orchestrator
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - VAULT_DIR=/vault
      - SKILLS_DIR=/skills
      - STORE_DIR=/instance
      - REPO_DIR=/repo
    volumes:
      - ./vault:/vault
      - ./.claude/skills:/skills          # rw: Skills im HUD baubar
      - ./instance:/instance              # persistente Config (Tasks/Settings/Agents)
      - ./:/repo                          # für den UPDATE-Button (git pull + rebuild)
      - /var/run/docker.sock:/var/run/docker.sock   # Update kann Container neu bauen
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: vault-caddy
    depends_on:
      - orchestrator
    ports:
      - "${HTTP_PORT:-3000}:80"     # HTTP  (HUD)
      - "${HTTPS_PORT:-3443}:443"   # HTTPS (nötig fürs Browser-Mikro / Voice)
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
