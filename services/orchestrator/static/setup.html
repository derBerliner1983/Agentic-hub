<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>V.A.U.L.T. · Einrichtung</title>
  <style>
    :root { --bg:#1c1c1f; --surface:#26262b; --sunken:#18181b; --fg:#f4f4f5; --muted:#a1a1aa;
            --accent:#34d399; --line:rgba(255,255,255,.08);
            --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
      background:var(--bg); color:var(--fg); font-family:var(--font); }
    .card { width:min(440px, 92vw); border:1px solid var(--line); padding:28px; border-radius:16px;
      background:var(--surface); box-shadow:0 24px 60px rgba(0,0,0,.4); }
    h1 { font-size:18px; font-weight:800; letter-spacing:.02em; margin:0 0 4px; }
    .sub { font-size:11px; color:var(--muted); margin-bottom:22px; }
    label { display:block; font-size:11px; color:var(--muted); margin:14px 0 5px; font-weight:500; }
    input { width:100%; background:var(--sunken); border:1px solid var(--line); color:var(--fg);
      font-family:var(--font); font-size:14px; padding:10px 12px; border-radius:12px; }
    input:focus { outline:none; border-color:var(--accent); }
    button { width:100%; margin-top:18px; background:var(--accent); border:0;
      color:#05231a; font-family:var(--font); font-size:13px; font-weight:600;
      padding:12px; cursor:pointer; border-radius:999px; }
    button:hover { opacity:.9; }
    .err { color:#f87171; font-size:11px; min-height:15px; margin-top:10px; }
    .qr { background:#fff; padding:10px; margin:14px auto; width:fit-content; border-radius:12px; }
    .qr svg { display:block; width:180px; height:180px; }
    .secret { font-size:11px; color:var(--accent); word-break:break-all; text-align:center; }
    .note { font-size:10.5px; color:var(--muted); line-height:1.6; margin-top:14px; }
    #step2 { display:none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>V.A.U.L.T.</h1>
    <div class="sub">ERSTEINRICHTUNG · ANMELDUNG + MFA</div>

    <div id="step1">
      <label>Admin-Benutzername</label>
      <input id="user" value="admin" autocomplete="username" />
      <label>Passwort (min. 8 Zeichen)</label>
      <input id="pw" type="password" autocomplete="new-password" />
      <label>Passwort wiederholen</label>
      <input id="pw2" type="password" autocomplete="new-password" />
      <label>Setup-Token <span style="opacity:.6">(nur falls SETUP_TOKEN gesetzt)</span></label>
      <input id="stoken" type="password" autocomplete="off" />
      <button id="next">Weiter → MFA einrichten</button>
    </div>

    <div id="step2">
      <div class="note">Scanne den QR-Code mit deiner Authenticator-App
        (Google Authenticator, Aegis, 2FAS, …) oder tippe das Secret manuell ein:</div>
      <div class="qr" id="qr"></div>
      <div class="secret" id="secret"></div>
      <label>6-stelliger Code aus der App</label>
      <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
      <button id="finish">Einrichtung abschließen</button>
    </div>

    <div class="err" id="err"></div>
    <div class="note">Hinweis: Zurücksetzen jederzeit möglich, indem auf dem Server
      <b>instance/auth.json</b> gelöscht wird.</div>
  </div>

  <script>
    const err = (m) => document.getElementById("err").textContent = m || "";
    let setupToken = null;

    document.getElementById("next").onclick = async () => {
      err("");
      const pw = document.getElementById("pw").value;
      if (pw.length < 8) return err("Passwort zu kurz (min. 8 Zeichen).");
      if (pw !== document.getElementById("pw2").value) return err("Passwörter stimmen nicht überein.");
      const r = await fetch("/auth/setup", { method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ username: document.getElementById("user").value, password: pw,
          setup_secret: document.getElementById("stoken").value }) });
      const j = await r.json();
      if (!j.ok) return err(j.error || "Fehler");
      setupToken = j.setup_token;
      document.getElementById("qr").innerHTML = j.qr_svg ||
        "<div style='color:#000;font-size:11px;max-width:180px'>QR nicht verfügbar – Secret manuell eintragen.</div>";
      document.getElementById("secret").textContent = j.secret;
      document.getElementById("step1").style.display = "none";
      document.getElementById("step2").style.display = "block";
    };

    document.getElementById("finish").onclick = async () => {
      err("");
      const code = document.getElementById("code").value.trim();
      const r = await fetch("/auth/setup/verify", { method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ setup_token: setupToken, code }) });
      const j = await r.json();
      if (!j.ok) return err(j.error || "Code falsch – bitte neu versuchen.");
      location.href = "/login";
    };
  </script>
</body>
</html>
