<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>V.A.U.L.T. · Login</title>
  <style>
    :root { --bg:#06070a; --fg:#e9e4d4; --muted:#7d8794; --gold:#d8b45a;
            --line:rgba(216,180,90,.18); --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
      background:radial-gradient(900px 500px at 50% 30%, #0d0f16 0%, #06070a 70%);
      color:var(--fg); font-family:var(--mono); letter-spacing:.06em; }
    .card { width:min(400px, 92vw); border:1px solid var(--line); padding:28px;
      background:rgba(10,12,18,.75); }
    h1 { font-size:18px; letter-spacing:.3em; margin:0 0 4px; }
    .sub { font-size:10px; color:var(--muted); letter-spacing:.22em; margin-bottom:22px; }
    label { display:block; font-size:11px; color:var(--muted); margin:12px 0 4px; }
    input { width:100%; background:#0a0c12; border:1px solid var(--line); color:var(--fg);
      font-family:var(--mono); font-size:14px; padding:10px 12px; }
    input:focus { outline:none; border-color:var(--gold); }
    button { width:100%; margin-top:18px; background:transparent; border:1px solid var(--gold);
      color:var(--gold); font-family:var(--mono); font-size:12px; letter-spacing:.14em;
      padding:11px; cursor:pointer; }
    button:hover { background:rgba(216,180,90,.1); }
    .err { color:#e05a5a; font-size:11px; min-height:15px; margin-top:10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>V.A.U.L.T.</h1>
    <div class="sub">ZUGANG · PASSWORT + MFA-CODE</div>
    <form id="f">
      <label>Benutzername</label>
      <input id="user" autocomplete="username" value="admin" />
      <label>Passwort</label>
      <input id="pw" type="password" autocomplete="current-password" />
      <label>MFA-Code (Authenticator-App)</label>
      <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
      <button type="submit">ANMELDEN</button>
    </form>
    <div class="err" id="err"></div>
  </div>

  <script>
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";
      const r = await fetch("/auth/login", { method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          username: document.getElementById("user").value,
          password: document.getElementById("pw").value,
          code: document.getElementById("code").value,
        }) });
      const j = await r.json().catch(() => ({}));
      if (j.ok) location.href = "/";
      else err.textContent = j.error || "Login fehlgeschlagen.";
    };
  </script>
</body>
</html>
