<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>V.A.U.L.T. · Login</title>
  <script>(function(){var t=localStorage.getItem("vault-theme");
    if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
    document.documentElement.setAttribute("data-theme",t);})();</script>
  <style>
    :root { --bg:#f7f7f8; --surface:#fff; --sunken:#f1f1f3; --fg:#0b0b0f; --muted:#52525b;
            --accent:#10b981; --line:rgba(0,0,0,.08);
            --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
    :root[data-theme="dark"] { --bg:#1c1c1f; --surface:#26262b; --sunken:#18181b; --fg:#f4f4f5;
            --muted:#a1a1aa; --accent:#34d399; --line:rgba(255,255,255,.08); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
      background:var(--bg); color:var(--fg); font-family:var(--font); }
    .card { width:min(400px, 92vw); border:1px solid var(--line); padding:28px; border-radius:16px;
      background:var(--surface); box-shadow:0 24px 60px rgba(0,0,0,.4); }
    h1 { font-size:18px; font-weight:800; letter-spacing:.02em; margin:0 0 4px; }
    .sub { font-size:11px; color:var(--muted); margin-bottom:22px; }
    label { display:block; font-size:11px; color:var(--muted); margin:14px 0 5px; font-weight:500; }
    input { width:100%; background:var(--sunken); border:1px solid var(--line); color:var(--fg);
      font-family:var(--font); font-size:14px; padding:10px 12px; border-radius:12px; }
    input:focus { outline:none; border-color:var(--accent); }
    button { width:100%; margin-top:18px; background:var(--accent); border:0;
      color:#05231a; font-family:var(--font); font-size:13px; font-weight:600;
      padding:12px; cursor:pointer; border-radius:999px; }
    button:hover { opacity:.9; }
    .err { color:#f87171; font-size:11px; min-height:15px; margin-top:10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>V.A.U.L.T.</h1>
    <div class="sub">ZUGANG · PASSWORT + MFA-CODE</div>
    <form id="f">
      <label>Benutzername</label>
      <input id="user" autocomplete="username" value="admin" />
      <label>Passwort</label>
      <input id="pw" type="password" autocomplete="current-password" />
      <div id="mfa-step" style="display:none">
        <label>MFA-Code (Authenticator-App)</label>
        <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
      </div>
      <button type="submit" id="submit">ANMELDEN</button>
    </form>
    <div class="err" id="err"></div>
  </div>

  <script>
    const f = document.getElementById("f");
    const err = document.getElementById("err");
    const mfaStep = document.getElementById("mfa-step");
    const submitBtn = document.getElementById("submit");
    let mfaMode = false;

    f.onsubmit = async (e) => {
      e.preventDefault();
      err.textContent = "";
      const body = {
        username: document.getElementById("user").value,
        password: document.getElementById("pw").value,
      };
      if (mfaMode) body.code = document.getElementById("code").value;
      const r = await fetch("/auth/login", { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (j.ok) { location.href = "/"; return; }
      if (j.mfa_required) {
        // Erst jetzt das MFA-Feld einblenden
        mfaMode = true;
        mfaStep.style.display = "block";
        submitBtn.textContent = "BESTÄTIGEN";
        document.getElementById("code").focus();
        return;
      }
      err.textContent = j.error || "Login fehlgeschlagen.";
    };
  </script>
</body>
</html>
